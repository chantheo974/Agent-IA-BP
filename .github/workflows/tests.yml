name: Tests Python 3.14

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Installer le logiciel
        run: python -m pip install -e .
      - name: Tests logiciels sur fixtures fictives
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Parcours de la fenêtre Windows
        run: python -X utf8 -m tca_bp.gui --smoke
