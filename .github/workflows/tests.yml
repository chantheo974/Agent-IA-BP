name: Tests Python 3.14 et atelier web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Installer le logiciel
        run: python -m pip install -e .
      - name: Tests Python, API web et migrations sur fixtures fictives
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Parcours de la fenêtre Windows
        run: python -X utf8 -m tca_bp.gui --smoke

  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances frontend verrouillées
        run: npm ci
      - name: Vérifier TypeScript et compiler le frontend
        run: npm run build
      - name: Installer Chromium pour les fixtures navigateur
        run: npx playwright install chromium
      - name: Tester les parcours web sur API fictive sans Excel ni fournisseur IA
        run: npm test
